[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-ss"
version = "0.1.0"
description = "LUNA fork: dual-rate (Gen1 5G / Gen2 10G) SuperSpeed device stack on the gw_usb3 PHY + gowin-serdes GTR12"
license = { text = "BSD" }
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Great Scott Gadgets", email = "dev@greatscottgadgets.com"},
    {name = "key2", email = "key2@users.noreply.github.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
]

dependencies = [
    "libusb1>1.9.2",
    "pyserial>=3.5",
    "pyusb>1.1.1",
    "pyvcd>=0.2.4",
    "amaranth[builtin-yosys]>=0.5.9,<0.6",
    "usb-protocol~=0.9.2",
]

[project.optional-dependencies]
dev = [
    "apollo_fpga",
    "prompt-toolkit>3.0.16",
]

[project.urls]
Repository = "https://github.com/key2/luna-ss"
Upstream   = "https://github.com/greatscottgadgets/luna"

[tool.setuptools.packages.find]
where = ["."]
include = ["luna*"]

[tool.pdm]
distribution = true

[tool.pdm.scripts]
# Upstream LUNA unit tests (unittest).
luna-test.cmd = "python -m unittest discover -t . -s tests -v"
# The full regression battery (38 entries: link-loopback configs,
# endpoint sim, gw_usb3 pytest suite, PHY training sims, stale-ack,
# tx-fuzz).  Gen1 entries are the regression fence for all Gen2 work.
battery.cmd = "bash sim/sim_battery.sh"

[tool.pdm.workspace]
members = ["gw_usb3", "gowin-serdes"]

[tool.pdm.dev-dependencies]
bench = [
    "-e file:///${PROJECT_ROOT}/gw_usb3#egg=gw-usb3",
    "-e file:///${PROJECT_ROOT}/gowin-serdes#egg=gowin-serdes",
]
[tool.pytest.ini_options]
# The gw_usb3 submodule hosts the PHY suite (static tables, Amaranth
# sims, cocotb golden-vs-port equivalence, link-layer-spec tests,
# GowinSynthesis miscompile guards).
testpaths = ["gw_usb3/tests"]
addopts = "-q"
markers = ["slow: long-running equivalence tests"]

# Bench/regression tooling + the submodules as editable installs.
# (Named "bench", not "dev": upstream already has an optional-
# dependencies extra called dev.)
[dependency-groups]
bench = [
    "cocotb>=2.0.1",
    "pytest>=9.1.1",
]
